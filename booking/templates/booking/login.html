{% extends "booking/base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="card p-4">
  <h4 class="mb-3">Đăng nhập</h4>
  {% if form.errors %}<div class="alert alert-danger">Sai tên đăng nhập hoặc mật khẩu.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="mb-3"><label class="form-label">Tên đăng nhập</label><input name="username" class="form-control" required autofocus></div>
    <div class="mb-3"><label class="form-label">Mật khẩu</label><input type="password" name="password" class="form-control" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-brand w-100">Đăng nhập</button>
  </form>
  <p class="small text-muted mt-3 mb-0">Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký</a></p>
</div></div></div>
{% endblock %}
