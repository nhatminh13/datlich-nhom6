<div class="table-responsive"><table class="table align-middle mb-0">
<thead><tr><th>Thời gian</th><th>Dịch vụ</th><th>Thợ</th><th>Trạng thái</th><th></th></tr></thead>
<tbody>
{% for a in items %}
<tr><td>{{ a.start|date:"d/m/Y" }} <b>{{ a.start|time:"H:i" }}–{{ a.end|time:"H:i" }}</b></td>
<td>{{ a.service.name }}</td><td>{{ a.staff }}</td><td>{% include "booking/_status.html" %}</td>
<td class="text-end"><a href="{% url 'appointment_detail' a.pk %}" class="btn btn-sm btn-outline-secondary">Chi tiết</a></td></tr>
{% empty %}<tr><td colspan="5" class="text-muted">Không có lịch hẹn.</td></tr>{% endfor %}
</tbody></table></div>
